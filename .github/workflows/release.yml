name: Release Binary

'on':
  push:
    tags:
      - 'v*.*.*'
  # A pull request that edits this workflow builds and smoke-tests both
  # binaries without publishing, so a broken release is found before a tag
  # is pushed rather than after.
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail, so a failure anywhere in a pipeline fails the step.
    shell: bash

env:
  BIN_NAME: makeutil
  # True when the tag names the crate version. Tag builds enforce it and pull
  # requests exercise it against a matching and a mismatching tag.
  TAG_MATCHES_VERSION: >-
    .packages[] | select(.name == env.BIN_NAME) | "v" + .version == $tag
  # What the smoke test requires of a real parse of bare-export.mk, so a
  # binary that merely exits 0 cannot pass.
  SMOKE_ORACLE: >-
    .schema_version == 1
    and .parse.status == "complete"
    and ([.variables[] | select(.exported) | .name]
      == ["MOLD_VERSION_FILE", "RUST_TOOLCHAIN_FILE", "CARGO_TERM_COLOR"])
    and ([.rules[].targets] == [["build"]])

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # The crate compiles only under Polonius, so the release uses the same
        # dated nightly as development rather than stable. The minimal profile
        # skips the development components rust-toolchain.toml lists, which a
        # release build does not need.
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${channel}" --profile minimal \
            --target "${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=${channel}" >> "${GITHUB_ENV}"
      - name: Check the tag matches the crate version
        # A tag that disagrees with Cargo.toml would publish binaries whose
        # `--version` contradicts the release they are attached to.
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          cargo metadata --no-deps --format-version 1
          | jq --exit-status --arg tag "${GITHUB_REF_NAME}"
          "${TAG_MATCHES_VERSION}"
      - name: Exercise the tag check
        # The tag check above runs only on tags, so a pull request proves the
        # same filter accepts the crate's own tag and refuses any other.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            > "${RUNNER_TEMP}/metadata.json"
          version="$(jq --raw-output \
            '.packages[] | select(.name == env.BIN_NAME) | .version' \
            "${RUNNER_TEMP}/metadata.json")"
          jq --exit-status --arg tag "v${version}" "${TAG_MATCHES_VERSION}" \
            "${RUNNER_TEMP}/metadata.json"
          jq --exit-status --arg tag "v${version}-mismatch" \
            "(${TAG_MATCHES_VERSION}) | not" "${RUNNER_TEMP}/metadata.json"
      - name: Build release binary
        env:
          # Replace the repository rustflags, whose x86_64 entry links with
          # mold, with Polonius alone; a static musl binary needs no linker
          # beyond the runner's default.
          RUSTFLAGS: -Zpolonius=next
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Prepare artefact
        run: |
          set -euo pipefail
          asset="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${asset}"
          cd dist
          sha256sum "${asset}" > "${asset}.sha256"
          sha256sum --check "${asset}.sha256"
      - name: Smoke-test the binary
        run: |
          set -euo pipefail
          binary="dist/${BIN_NAME}-${{ matrix.target }}"
          file "${binary}" | grep -Eq 'static-pie linked|statically linked'
          "${binary}" parse tests/fixtures/makefiles/bare-export.mk \
            | jq --exit-status "${SMOKE_ORACLE}"
      - name: Upload release artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  release-dry-run:
    # Runs the publishing job's download and file glob on a pull request,
    # without publishing, and requires exactly the four expected assets.
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          path: artefacts
      - name: Check the release file glob
        run: |
          set -euo pipefail
          find artefacts -mindepth 2 -maxdepth 2 -type f -printf '%f\n' \
            | sort > "${RUNNER_TEMP}/found"
          printf '%s\n' \
            "${BIN_NAME}-aarch64-unknown-linux-musl" \
            "${BIN_NAME}-aarch64-unknown-linux-musl.sha256" \
            "${BIN_NAME}-x86_64-unknown-linux-musl" \
            "${BIN_NAME}-x86_64-unknown-linux-musl.sha256" \
            > "${RUNNER_TEMP}/expected"
          diff "${RUNNER_TEMP}/expected" "${RUNNER_TEMP}/found"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          path: artefacts
      - uses: softprops/action-gh-release@a4f117a9dd5572319a486154ec1147aebabd285c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artefacts/*/*

  verify-binstall:
    # Installs the just-published release the way a glibc host would, naming
    # the `-gnu` triple explicitly so only the binstall override for it can
    # resolve an asset. A missing or wrong override fails here, on the tag,
    # rather than on a user's machine.
    name: verify-binstall (${{ matrix.host }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@2a910bfcfd1ea4216419f9290331785f05b33320
      - name: Install the release with cargo-binstall
        # --manifest-path reads the binstall metadata from the tagged
        # checkout, since makeutil is not published to crates.io.
        run: >-
          cargo binstall --no-confirm --manifest-path .
          --targets "${{ matrix.host }}"
          --root "${RUNNER_TEMP}/binstall" "${BIN_NAME}"
      - name: Smoke-test the installed binary
        run: >-
          "${RUNNER_TEMP}/binstall/bin/${BIN_NAME}" parse
          tests/fixtures/makefiles/bare-export.mk
