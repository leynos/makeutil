name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@b804b69fa7f978cf9091b9d9bd5481d8ce58c2ea
        with:
          install-mold: 'true'
          expect-cache: any
          install-clang-lld: 'true'
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.1 fixed the wrapping
        # and Setext rewrites the estate relies on.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: '0.6.1'
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@4d036b826b8b2df8671d140de0d86cef0f5c2202
        with:
          globs: '**/*.md'
      - name: Setup uv
        uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Check spelling
        run: make spelling
      - name: Check provenance
        run: make provenance
      - name: Install test runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm cargo-nextest
      - name: Install cargo-audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm cargo-audit
      - name: Setup Python for audit manifest extraction
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@5a99aed78ce68dcebd3052b75c31e6f173162b1e
        with:
          cranelift: true
      - name: Audit dependencies
        run: make audit
      - name: Lint
        run: make lint
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -Zpolonius=next -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@cabf105ae230e3759cf77b1c2d1d73ea0b67e9a9
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -Zpolonius=next -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
      # The doctests are the only part of `make test` the coverage step does
      # not run. The flags are the ones `make test` gives its doctest line.
      # tests/workflow_suite_contract.rs holds the split.
          # The pull request measures coverage for its own ratchet check and
          # nothing else: it neither publishes the report nor contacts
          # CodeScene. Main owns both, in coverage-main.yml, and
          # `make test-workflow-contracts` holds the split.
          with-ratchet: 'true'
          # The baseline file moved to `-v2` when the nightly-2026-10-30 bump
          # lowered the measured coverage with the tests unchanged: the new path
          # misses the old cached baseline, so the ratchet reads the committed
          # figure and main saves under the new path.
          baseline-rust-file: .coverage-baseline-v2.rust
          publish-artefact: 'false'
      - name: Run doctests
        env:
          # An assigned RUSTFLAGS replaces .cargo/config.toml's rustflags, so
          # the step restates the build standard's flags beside the deny.
          RUSTFLAGS: -Zpolonius=next -D warnings -Zthreads=8 -Clink-arg=-fuse-ld=mold
        run: cargo test --doc --workspace --all-features
